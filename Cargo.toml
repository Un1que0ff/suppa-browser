[package]
name = "suppa"
version = "0.10.2"
edition = "2024"
build = "build.rs"

[[bin]]
name = "Suppa"
path = "src/main.rs"

[dependencies]
# Brave's ad-block engine (EasyList / uBlock syntax, cosmetic filters, scriptlets)
adblock = "0.13.6"
# WebView2 (Edge Chromium already installed in Windows) COM bindings
webview2-com = "0.39.1"
serde_json = "1"
base64 = "0.23"
# WinRT async results (Windows Hello check)
windows-future = "0.3"

[build-dependencies]
# Only used by build.rs to write the embedded icon (not part of Suppa.exe)
png = "0.17"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_WinRT",
    "Security_Credentials_UI",
    "Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# Small + fast release build
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
