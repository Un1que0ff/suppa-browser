<!doctype html>
<!-- Suppa Browser for Android - the tabs screen (the tabs button next to the address bar).
     Every tab is a tile with a picture of its page. Tap = switch, × or swipe sideways = close,
     long press = menu, long press and move = sort, drag onto another tile and hold = group.
     Edit, then press "Update" in the browser. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #161616; --panel: #1f1f1f; --field: #272727; --btn: #2e2e2e; --btn-hover: #3b3b3b;
    --fg: #ececec; --muted: #8e8e8e; --border: #383838; --accent: #b07cff; --on-accent: #1c1c1c; --incognito: #5b4a86;
    --radius: 10px; --r-btn: max(0px, calc(var(--radius) - 1px)); --r-tile: calc(var(--radius) + 4px);
    --ic-w: 1.6; --ic-cap: round; --ic-join: round; --ic-fill: none; --ic-fo: 1;
  }
  body.light { --bg: #f2f2f2; --panel: #ffffff; --field: #ffffff; --btn: #e5e5e5; --btn-hover: #d8d8d8; --fg: #1c1c1c; --muted: #6b6b6b; --border: #d0d0d0; --incognito: #6f5aa8; }
  body.ic-bold { --ic-w: 2.3; } body.ic-sharp { --ic-w: 1.7; --ic-cap: square; --ic-join: miter; }
  body.ic-filled { --ic-w: 1.8; --ic-fill: currentColor; } body.ic-duotone { --ic-w: 1.7; --ic-fill: currentColor; --ic-fo: .3; }
  body.squircle *, body.squircle *::before { corner-shape: squircle; }
  body.squircle .x, body.squircle .spin { corner-shape: round; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); user-select: none; -webkit-user-select: none; }
  body { font: 600 10pt system-ui, sans-serif; }
  svg { display: block; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: var(--ic-w); stroke-linecap: var(--ic-cap); stroke-linejoin: var(--ic-join); }
  svg .f { fill: var(--ic-fill); fill-opacity: var(--ic-fo); }
  button {
    height: 40px; min-width: 40px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--btn); color: var(--fg); border: 1px solid var(--border); border-radius: var(--r-btn); font: inherit;
  }
  /* ---- top bar ---- */
  #top {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--panel); box-shadow: inset 0 -1px var(--border);
  }
  #seg { flex: 1 1 auto; display: flex; justify-content: center; gap: 4px; }
  #seg button { border-color: transparent; background: transparent; color: var(--muted); padding: 0 14px; }
  #seg button.on { background: var(--accent); color: var(--on-accent); }
  #seg button.on.inc { background: var(--incognito); color: #fff; }
  .count { min-width: 22px; height: 22px; padding: 0 5px; border: 2px solid currentColor; border-radius: 6px; display: inline-grid; place-items: center; font-size: 9pt; }
  /* ---- tiles ---- */
  #grid { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 12px; padding: 14px 12px 90px; }
  .tile {
    position: relative; display: flex; flex-direction: column; border-radius: var(--r-tile); overflow: hidden;
    background: var(--panel); border: 1px solid var(--border); aspect-ratio: 3 / 4; touch-action: pan-y;
    transition: transform .2s ease, opacity .2s ease, box-shadow .15s ease;
  }
  .tile.active { border: 3px solid var(--accent); }
  .tile.inc { background: color-mix(in srgb, var(--incognito) 35%, var(--panel)); }
  .tile.grouped { box-shadow: inset 0 4px 0 var(--g); }
  .tile.grouped.active { border-color: var(--g); box-shadow: none; }
  .tile .head { display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 4px 0 10px; flex: 0 0 auto; }
  .tile .head img, .tile .head .ph { width: 16px; height: 16px; flex: 0 0 16px; object-fit: contain; border-radius: 3px; }
  .tile .head .ph { background: var(--btn); }
  .tile .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9.5pt; }
  .tile.unloaded .t { font-style: italic; color: var(--muted); }
  .tile .x { flex: 0 0 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; font-size: 18px; color: var(--muted); }
  .tile .x:active { background: var(--btn-hover); }
  .tile .pic { flex: 1 1 auto; min-height: 0; background: var(--bg); position: relative; overflow: hidden; }
  .tile .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; pointer-events: none; }
  .tile .pic .letter { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; color: var(--muted); }
  .spin { width: 14px; height: 14px; flex: 0 0 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tile.lifted { transform: scale(1.04); box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 3; transition: box-shadow .15s ease; }
  .tile.dragging { transition: none; z-index: 4; opacity: .92; }
  .tile.group-target { outline: 3px solid var(--gt, var(--accent)); outline-offset: 2px; }
  .tile.closing { opacity: 0; transform: scale(.85) !important; }
  /* one-colour site icons that would vanish in this theme */
  body.light img.ic-w, body:not(.light) img.ic-b { filter: invert(1); }
  /* ---- groups: a coloured label over its tiles ---- */
  .ghead { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .gchip {
    display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; max-width: 100%;
    border-radius: var(--r-btn); background: var(--g); color: var(--g-fg); font-weight: 600;
  }
  .gchip .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gchip .c { opacity: .85; }
  .ghead .arrow { color: var(--muted); }
  .ghead.collapsed .gchip { opacity: .8; }
  .gchip input { width: 160px; height: 26px; border: 2px solid var(--accent); border-radius: 6px; background: var(--field); color: var(--fg); font: inherit; padding: 0 6px; outline: none; }
  #empty { display: none; text-align: center; color: var(--muted); padding: 60px 20px; font-weight: 400; }
  #empty button { margin-top: 16px; }
  /* new tab: round button in the corner, like on a phone */
  #fab {
    position: fixed; right: 18px; bottom: 22px; z-index: 6; width: 56px; height: 56px; border-radius: 18px;
    background: var(--accent); color: var(--on-accent); border: none; box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  body.inc-mode #fab { background: var(--incognito); color: #fff; }
  #fab svg { width: 24px; height: 24px; }
</style>
</head>
<body>
  <div id="top">
    <button id="done" title="Back to the page"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
    <div id="seg">
      <button id="m-normal" class="on"><span class="count" id="c-normal">0</span> Tabs</button>
      <button id="m-inc" class="inc"><span class="count" id="c-inc">0</span> Incognito</button>
    </div>
    <button id="more" title="Menu"><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
  </div>
  <div id="grid"></div>
  <div id="empty"><div id="empty-t">No tabs</div><button id="empty-new">New tab</button></div>
  <button id="fab" title="New tab"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const post = (m) => window.chrome.webview.postMessage(m);
let S = { tabs: [], groups: [], active: 0, inc: false };
const INC_ICON = '<svg viewBox="0 0 16 16" style="width:16px;height:16px;flex:0 0 16px" fill="currentColor"><path d="M2 7h12l-1.2-3.6A1 1 0 0 0 11.8 3H4.2a1 1 0 0 0-.95.7z" stroke="none"/><circle cx="4.5" cy="11" r="2.3"/><circle cx="11.5" cy="11" r="2.3"/></svg>';

function onColor(hex, mode) {
  if (mode === 'black') return '#1c1c1c';
  if (mode === 'white') return '#ffffff';
  const n = parseInt((hex || '#b07cff').slice(1), 16);
  return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 160 ? '#1c1c1c' : '#ffffff';
}
let onAccent = 'auto';
function theme(m) {
  document.body.classList.toggle('light', !m.dark);
  document.documentElement.style.colorScheme = m.dark ? 'dark' : 'light';
  for (const [k, v] of Object.entries(m.colors || {})) document.body.style.setProperty('--' + k, v);
  const acc = m.accent === 'cycle' ? (m.dark ? '#b07cff' : '#7048e8') : m.accent;
  onAccent = m.on_accent || 'auto';
  document.body.style.setProperty('--accent', acc);
  document.body.style.setProperty('--on-accent', onColor(acc, onAccent));
  document.body.classList.toggle('squircle', !!m.squircle);
  for (const p of ['bold', 'sharp', 'filled', 'duotone']) document.body.classList.toggle('ic-' + p, m.icons === p);
  const r = m.squircle ? Math.round(m.radius * 1.6) : m.radius;
  document.documentElement.style.setProperty('--radius', r + 'px');
}

// ---------- render ----------
const tileById = new Map();
function makeTile() {
  const el = document.createElement('div');
  el.className = 'tile';
  el.innerHTML = '<div class="head"><span class="ico"></span><span class="t"></span><span class="x">×</span></div><div class="pic"></div>';
  el._x = el.querySelector('.x');
  el._x.addEventListener('click', (e) => { e.stopPropagation(); closeTile(el); });
  el.addEventListener('pointerdown', (e) => onDown(e, el));
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  return el;
}
function setIcon(el, t) {
  const key = t.s === 'loading' ? 'spin' : t.inc ? 'inc' : (t.f || '-');
  if (el._icoKey === key) return;
  el._icoKey = key;
  const box = el.querySelector('.ico');
  box.style.display = 'contents';
  box.innerHTML = key === 'spin' ? '<span class="spin"></span>' : key === 'inc' ? INC_ICON : key === '-' ? '<span class="ph"></span>' : '';
  if (!box.innerHTML) {
    const img = document.createElement('img');
    img.src = t.f;
    img.onerror = () => { img.replaceWith(Object.assign(document.createElement('span'), { className: 'ph' })); };
    box.appendChild(img);
  }
}
function setPic(el, t) {
  const pic = el.querySelector('.pic');
  if (el._th === t.th && pic.childElementCount) return;
  el._th = t.th;
  pic.textContent = '';
  if (t.th) {
    const img = document.createElement('img');
    img.src = t.th;
    pic.appendChild(img);
  } else {
    const l = document.createElement('div');
    l.className = 'letter';
    let h = '';
    try { h = new URL(t.u).hostname.replace(/^www\./, ''); } catch (e) {}
    l.textContent = (h || t.t || '+').charAt(0).toUpperCase();
    pic.appendChild(l);
  }
}

const chipById = new Map();
function groupHead(g, count) {
  let h = chipById.get(g.id);
  if (!h) {
    h = document.createElement('div');
    h.className = 'ghead';
    h.innerHTML = '<span class="gchip"><span class="n"></span><span class="c"></span></span><span class="arrow"></span>';
    const chip = h.firstChild;
    let timer = 0, long = false;
    chip.addEventListener('pointerdown', (e) => {
      long = false;
      timer = setTimeout(() => { long = true; const r = chip.getBoundingClientRect(); post({ cmd: 'group_menu', id: h._gid, x: r.left, y: r.bottom + 4 }); }, 450);
    });
    const stop = () => clearTimeout(timer);
    chip.addEventListener('pointerup', stop);
    chip.addEventListener('pointercancel', stop);
    chip.addEventListener('pointermove', (e) => { if (Math.abs(e.movementY) > 4) stop(); });
    chip.addEventListener('click', () => { if (!long && !chip.querySelector('input')) post({ cmd: 'group_toggle', id: h._gid }); });
    chip.addEventListener('contextmenu', (e) => e.preventDefault());
    chipById.set(g.id, h);
  }
  h._gid = g.id;
  const chip = h.firstChild;
  chip.style.setProperty('--g', g.color);
  chip.style.setProperty('--g-fg', onColor(g.color, 'auto'));
  if (!chip.querySelector('input')) chip.querySelector('.n').textContent = g.name || 'Group';
  chip.querySelector('.c').textContent = count + (count === 1 ? ' tab' : ' tabs');
  h.classList.toggle('collapsed', !!g.collapsed);
  h.querySelector('.arrow').textContent = g.collapsed ? '▸ tap to show' : '';
  return h;
}

function render() {
  if (drag && drag.on) return;   // finish sorting first
  document.body.classList.toggle('inc-mode', S.inc);
  $('m-normal').classList.toggle('on', !S.inc);
  $('m-inc').classList.toggle('on', S.inc);
  $('c-normal').textContent = S.count;
  $('c-inc').textContent = S.count_inc;
  $('grid').style.setProperty('--cols', window.innerWidth >= 900 ? 4 : window.innerWidth >= 560 ? 3 : 2);
  const groups = new Map(S.groups.map((g) => [g.id, g]));
  const list = S.tabs.filter((t) => t.inc === S.inc);
  const seq = [];
  const ids = new Set(list.map((t) => t.id));
  for (const [id, el] of tileById) if (!ids.has(id)) { tileById.delete(id); el.remove(); }
  for (const [gid, h] of chipById) if (!groups.has(gid)) { chipById.delete(gid); h.remove(); }
  list.forEach((t, k) => {
    const g = t.g && groups.get(t.g);
    if (g && (k === 0 || list[k - 1].g !== t.g)) seq.push(groupHead(g, list.filter((x) => x.g === t.g).length));
    let el = tileById.get(t.id);
    if (!el) { el = makeTile(); tileById.set(t.id, el); }
    el._t = t;
    el._i = t.index;
    el.className = 'tile' + (t.index === S.active ? ' active' : '') + (t.inc ? ' inc' : '') + (t.s ? ' ' + t.s : '') + (g ? ' grouped' : '');
    el.style.display = g && g.collapsed ? 'none' : '';
    if (g) { el.style.setProperty('--g', g.color); } else el.style.removeProperty('--g');
    el.querySelector('.t').textContent = t.t;
    setIcon(el, t);
    setPic(el, t);
    seq.push(el);
  });
  const grid = $('grid');
  seq.forEach((el, k) => { if (grid.children[k] !== el) grid.insertBefore(el, grid.children[k] || null); });
  while (grid.children.length > seq.length) grid.lastChild.remove();
  $('empty').style.display = list.length ? 'none' : 'block';
  $('empty-t').textContent = S.inc ? 'No incognito tabs. Nothing you do in them is saved.' : 'No tabs';
  $('empty-new').textContent = S.inc ? 'New incognito tab' : 'New tab';
  if (pendingRename && chipById.has(pendingRename)) { const id = pendingRename; pendingRename = 0; startRename(id); }
}
function scrollToActive() {
  const el = [...tileById.values()].find((e) => e._i === S.active);
  if (el) el.scrollIntoView({ block: 'center' });
}

// ---------- close: × or swipe sideways ----------
function closeTile(el) {
  el.classList.add('closing');
  setTimeout(() => post({ cmd: 'close', index: el._i }), 160);
}

// ---------- touch: tap, swipe, long press (menu), long press + move (sort / group) ----------
let drag = null;
function onDown(e, el) {
  if (e.target === el._x || (e.pointerType === 'mouse' && e.button !== 0)) return;
  drag = { el, x0: e.clientX, y0: e.clientY, id: e.pointerId, lifted: false, on: false, swipe: false, moved: false };
  drag.timer = setTimeout(() => {
    if (!drag || drag.moved) return;
    drag.lifted = true;
    el.classList.add('lifted');
    if (navigator.vibrate) navigator.vibrate(15);
  }, 420);
  el.setPointerCapture(e.pointerId);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onCancel);
}
// While a tile is lifted the page must not scroll.
document.addEventListener('touchmove', (e) => { if (drag && drag.lifted) e.preventDefault(); }, { passive: false });
function tiles() { return [...tileById.values()].filter((t) => t.isConnected && t.style.display !== 'none'); }
function onMove(e) {
  const d = drag;
  if (!d || e.pointerId !== d.id) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if (!d.moved && Math.hypot(dx, dy) > 8) d.moved = true;
  if (d.lifted) {
    if (!d.on && d.moved) {
      d.on = true;
      d.el.classList.add('dragging');
      d.rects = tiles().map((t) => ({ el: t, r: t.getBoundingClientRect() }));
    }
    if (!d.on) return;
    d.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.04)';
    // The tile under the finger: hold on its middle to group, else it is the new place.
    let over = null;
    for (const o of d.rects) {
      if (o.el === d.el) continue;
      const r = o.r;
      if (e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom) over = o.el;
    }
    if (over !== d.over) {
      d.over = over;
      d.ready = false;
      clearTimeout(d.holdT);
      tiles().forEach((t) => t.classList.remove('group-target'));
      if (over) {
        d.holdT = setTimeout(() => {
          if (drag !== d || d.over !== over) return;
          d.ready = true;
          over.classList.add('group-target');
          over.style.setProperty('--gt', over.style.getPropertyValue('--g') || getComputedStyle(document.body).getPropertyValue('--accent'));
          if (navigator.vibrate) navigator.vibrate(10);
        }, 600);
      }
    }
    return;
  }
  clearTimeout(d.timer);
  // Sideways: swipe to close.
  if (!d.swipe && Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.4) d.swipe = true;
  if (d.swipe) {
    d.el.style.transition = 'none';
    d.el.style.transform = 'translateX(' + dx + 'px)';
    d.el.style.opacity = String(Math.max(0.2, 1 - Math.abs(dx) / d.el.offsetWidth));
  }
}
function finish(e) {
  const d = drag;
  drag = null;
  if (!d) return null;
  clearTimeout(d.timer);
  clearTimeout(d.holdT);
  d.el.removeEventListener('pointermove', onMove);
  d.el.removeEventListener('pointerup', onUp);
  d.el.removeEventListener('pointercancel', onCancel);
  d.el.classList.remove('lifted', 'dragging');
  tiles().forEach((t) => t.classList.remove('group-target'));
  return d;
}
function settle(el) {
  el.style.transition = '';
  el.style.transform = '';
  el.style.opacity = '';
}
function onCancel(e) { const d = finish(e); if (d) settle(d.el); }
function onUp(e) {
  const d = finish(e);
  if (!d) return;
  if (d.swipe) {
    const dx = e.clientX - d.x0;
    if (Math.abs(dx) > d.el.offsetWidth * 0.35) {
      d.el.style.transition = 'transform .15s ease, opacity .15s ease';
      d.el.style.transform = 'translateX(' + (dx > 0 ? 1 : -1) * window.innerWidth + 'px)';
      d.el.style.opacity = '0';
      setTimeout(() => post({ cmd: 'close', index: d.el._i }), 150);
    } else settle(d.el);
    return;
  }
  if (d.on) {
    settle(d.el);
    if (d.over && d.ready) post({ cmd: 'group', from: d.el._i, target: d.over._i });
    else if (d.over) post({ cmd: 'move', from: d.el._i, to: d.over._i });
    return;
  }
  settle(d.el);
  if (d.lifted) {
    const r = d.el.getBoundingClientRect();
    post({ cmd: 'menu', index: d.el._i, x: Math.min(e.clientX, r.right), y: e.clientY });
    return;
  }
  if (!d.moved) post({ cmd: 'activate', index: d.el._i });
}

// ---------- group names ----------
let pendingRename = 0;
function startRename(id) {
  const h = chipById.get(id);
  if (!h || !h.isConnected) { pendingRename = id; return; }
  const chip = h.firstChild;
  if (chip.querySelector('input')) return;
  const n = chip.querySelector('.n');
  const inp = document.createElement('input');
  inp.placeholder = 'Group name';
  inp.value = (S.groups.find((g) => g.id === id) || {}).name || '';
  n.textContent = '';
  n.appendChild(inp);
  inp.focus();
  let done = false;
  const end = (ok) => {
    if (done) return;
    done = true;
    const v = inp.value.trim();
    inp.remove();
    if (ok) {
      const g = S.groups.find((x) => x.id === id);
      if (g) g.name = v;
      post({ cmd: 'group_rename', id, name: v });
    }
    render();
  };
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') end(true); else if (e.key === 'Escape') end(false); });
  inp.addEventListener('blur', () => end(true));
  inp.addEventListener('click', (e) => e.stopPropagation());
  inp.addEventListener('pointerdown', (e) => e.stopPropagation());
}

// ---------- buttons ----------
$('done').onclick = () => post({ cmd: 'done' });
$('m-normal').onclick = () => post({ cmd: 'mode', inc: false });
$('m-inc').onclick = () => post({ cmd: 'mode', inc: true });
$('fab').onclick = () => post({ cmd: 'new', inc: S.inc });
$('empty-new').onclick = () => post({ cmd: 'new', inc: S.inc });
$('more').onclick = () => { const r = $('more').getBoundingClientRect(); post({ cmd: 'more', x: r.right, y: r.bottom + 4 }); };
document.addEventListener('contextmenu', (e) => { if (e.target.tagName !== 'INPUT') e.preventDefault(); });
window.addEventListener('resize', render);

window.chrome.webview.addEventListener('message', (e) => {
  const m = e.data;
  if (m.type === 'theme') theme(m);
  else if (m.type === 'tabs') { const first = !S.tabs.length; S = m; render(); if (first) scrollToActive(); }
  else if (m.type === 'shown') { render(); scrollToActive(); }
  else if (m.type === 'group_rename') startRename(m.id);
});
post({ cmd: 'ready' });
</script>
</body>
</html>
