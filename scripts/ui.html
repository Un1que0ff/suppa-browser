<!doctype html>
<!-- Suppa Browser - top bar (tabs = title bar). Edit, then press "Update" in the browser. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="frame-top"></div>
  <!-- The bar fills the whole window behind the page; the page covers #hole.
       Rows at the left/right edge go into a column (Settings -> Layout). -->
  <div id="hole"></div>
  <div class="col" id="colL"><div class="sizer sz-col" title="Drag to change the width"></div></div>
  <div class="col" id="colR"><div class="sizer sz-col" title="Drag to change the width"></div></div>
  <div id="shead"></div>
  <div id="row1">
    <div id="tabs">
      <button id="newtab" title="New tab (Ctrl+T)"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
    </div>
    <div id="drag"></div>
    <div id="winctl">
      <button id="min" title="Minimize"></button>
      <button id="max" title="Maximize"></button>
      <button id="close" title="Close"></button>
    </div>
  </div>
  <div id="row2">
    <button class="nav" id="back" title="Back (Alt+Left)"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
    <button class="nav" id="fwd" title="Forward (Alt+Right)"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
    <button class="nav" id="reload" title="Reload (F5)"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg></button>
    <button class="nav" id="home" title="Home (Alt+Home)"><svg viewBox="0 0 16 16"><path class="f" d="M2.5 7.3 8 2.8l5.5 4.5V13a.6.6 0 0 1-.6.6H9.7v-3.4H6.3v3.4H3.1a.6.6 0 0 1-.6-.6z"/></svg></button>
    <div id="addr-box">
      <span id="inc-badge" title="Incognito tab: nothing is saved">Incognito</span>
      <input id="addr" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
      <button id="star" title="Save this website to the saved tabs bar"><svg viewBox="0 0 16 16"><path class="f" d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg></button>
    </div>
    <!-- Downloads (≡ -> Show download button). While something downloads, the
         accent fills it clockwise from 12 o'clock with the progress; the icon
         turns the on-accent colour where the fill already is. -->
    <button class="nav" id="dl" title="Downloads" hidden><i class="fill"></i><svg viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7.5L8 11l3.5-3.5M3 13.5h10"/></svg><svg class="on" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7.5L8 11l3.5-3.5M3 13.5h10"/></svg></button>
    <!-- Extension buttons (click = popup, right-click = options / hide / remove) -->
    <div id="exts"></div>
    <button id="menu" title="Menu: Update, Extensions, Ad blocker, Log, Theme, Settings"><span class="upd">Update</span><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
  </div>
  <!-- Saved tabs: right-click a tab -> Save. Drag to sort, drop on another to make a folder. -->
  <div id="row3"><div id="saved"></div><div id="ins"></div></div>
  <!-- Drag these lines up/down to resize the rows (≡ -> Lock bar sizes turns this off). -->
  <div class="sizer" id="sz-tabs" title="Drag to resize the tabs row"></div>
  <div class="sizer" id="sz-nav" title="Drag to resize the address bar row"></div>
  <div class="sizer" id="sz-saved" title="Drag to resize the saved tabs row"></div>
  <!-- Resize handles along the top edge (the window has no title bar). -->
  <div class="grip" id="grip-top"></div>
  <div class="grip" id="grip-tl"></div>
  <div class="grip" id="grip-tr"></div>
  <script src="ui.js"></script>
</body>
</html>
