<!doctype html>
<!-- Suppa Browser - popup menus (≡, tabs, saved tabs, page right-click).
     Edit, then press "Update" in the browser. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --panel: #1f1f1f; --hover: #333333; --fg: #ececec; --muted: #8e8e8e; --border: #383838;
    --accent: #b07cff; --on-accent: #1c1c1c;
    /* Corner roundness (Settings -> Corner roundness). The menu box is 2px rounder. */
    --radius: 10px; --r-menu: calc(var(--radius) + 2px); --r-item: max(0px, calc(var(--radius) - 2px)); --r-btn: max(0px, calc(var(--radius) - 1px));
  }
  body.light { --panel: #ffffff; --hover: #ececec; --fg: #1c1c1c; --muted: #6b6b6b; --border: #d0d0d0; }
  * { box-sizing: border-box; }
  body.squircle *, body.squircle *::before, body.squircle *::after { corner-shape: squircle; }
  /* long menus: scrollbar in the interface colours */
  ::-webkit-scrollbar { width: 10px; background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hover); border: 3px solid transparent; background-clip: padding-box; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
  /* The window is cut to the rounded shape (popup.rs). The few pixels between
     that cut and the box's outline take the panel colour (set from the theme by
     the script below), so nothing light ever shows in the corners. */
  html, body { margin: 0; background: var(--panel); overflow: hidden; user-select: none; }
  body { font: 400 10pt "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  #m {
    position: absolute; left: 0; top: 0; width: max-content; min-width: 230px; max-width: 460px;
    max-height: 100vh; overflow-y: auto; padding: 6px; background: var(--panel);
    border: 1px solid var(--border);
    /* 1px rounder than the window cut, so the whole outline stays inside it */
    border-radius: calc(var(--r-menu) + 1px);
    /* no browser focus ring (white + dark) around the box: keys are handled by the script */
    outline: none;
  }
  .head {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; margin-bottom: 4px;
    border-radius: var(--r-item); font-weight: 600; color: var(--muted);
  }
  .head:hover, .head.sel { background: var(--hover); color: var(--fg); }
  .it {
    display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 12px;
    border-radius: var(--r-item); white-space: nowrap; cursor: default;
  }
  .it.sel { background: var(--hover); }
  .it.off { color: var(--muted); }
  .it.hot .lab { color: var(--accent); font-weight: 600; }
  .chk { width: 16px; flex: 0 0 16px; text-align: center; color: var(--accent); font-weight: 700; margin-left: -4px; }
  /* no item in this menu can be ticked: no checkmark column, text starts at the same
     distance from the edge as the shortcuts end on the other side */
  #m.nochk .chk { display: none; }
  .ico { width: 16px; height: 16px; flex: 0 0 16px; object-fit: contain; }
  .lab { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
  .key { color: var(--muted); font-size: 9pt; margin-left: 24px; }
  .arr { color: var(--muted); margin-left: 12px; }
  .sep { height: 1px; background: var(--border); margin: 5px 6px; }
  .it.dragging { opacity: .35; }
  .ins { height: 2px; background: var(--accent); border-radius: 1px; margin: -1px 6px; }
  body.out, body.out * { cursor: copy !important; }
  /* ---- dialogs (Update, confirmations, messages) ---- */
  #m.dialog { min-width: 360px; max-width: 460px; padding: 18px 18px 14px; width: max-content; }
  .ttl { font-size: 11.5pt; font-weight: 600; margin: 0 2px 8px; max-width: 420px; white-space: normal; }
  .txt { color: var(--muted); margin: 0 2px 4px; max-width: 420px; white-space: pre-line; line-height: 1.45; }
  .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .btn {
    height: 32px; padding: 0 18px; border-radius: var(--r-btn); border: 1px solid var(--border);
    background: var(--hover); color: var(--fg); font: inherit; cursor: default; outline: none;
  }
  .btn:hover { filter: brightness(1.15); }
  /* the main button is exactly the accent colour (like the bar), also when focused */
  .btn.hot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.hot:hover { filter: brightness(1.06); }
  /* keyboard focus: a thin accent ring around the button, its colour unchanged */
  .btn.sel { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--accent); }
  .btn.hot.sel { box-shadow: none; }
</style>
</head>
<body>
<div id="m"></div>
<script>
'use strict';
const m = document.getElementById('m');
const post = (x) => window.chrome.webview.postMessage(x);
let stack = [];      // panels: {title, items}
let sel = -1;
let open = false;

function onColor(hex) {
  const n = parseInt((hex || '#b07cff').slice(1), 16);
  return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 160 ? '#1c1c1c' : '#ffffff';
}

function cur() { return stack[stack.length - 1]; }
function rows() { return [...m.querySelectorAll('.it, .btn')]; }

// A popup with a heading is a dialog: title, text, buttons in a row.
function renderDialog(items) {
  m.className = 'dialog';
  const btns = document.createElement('div');
  btns.className = 'btns';
  for (const it of items) {
    if (it.H || it.P) {
      const d = document.createElement('div');
      d.className = it.H ? 'ttl' : 'txt';
      d.textContent = it.l;
      m.appendChild(d);
    } else if (!it.s) {
      const b = document.createElement('button');
      b.className = 'btn' + (it.h ? ' hot' : '');
      b.textContent = it.l;
      b._item = it;
      b.addEventListener('click', () => activate(b));
      b.addEventListener('mouseenter', () => select(rows().indexOf(b)));
      btns.appendChild(b);
    }
  }
  m.appendChild(btns);
  // Enter = the main (accent) button.
  const r = rows();
  select(Math.max(0, r.findIndex((b) => b.classList.contains('hot'))));
  report();
}

function render() {
  const p = cur();
  m.textContent = '';
  m.className = '';
  sel = -1;
  if (!p.items.some((it) => it.c)) m.classList.add('nochk');
  if (stack.length === 1 && p.items.some((it) => it.H)) { renderDialog(p.items); return; }
  if (stack.length > 1) {
    const h = document.createElement('div');
    h.className = 'head';
    h.textContent = '‹  ' + p.title;
    h.onclick = back;
    m.appendChild(h);
  }
  p.items.forEach((it, i) => {
    if (it.s) {
      const s = document.createElement('div');
      s.className = 'sep';
      m.appendChild(s);
      return;
    }
    const el = document.createElement('div');
    el.className = 'it' + (it.e ? '' : ' off') + (it.h ? ' hot' : '');
    el._item = it;
    el._index = i;
    const chk = document.createElement('span');
    chk.className = 'chk';
    chk.textContent = it.c ? '✓' : '';
    el.appendChild(chk);
    if (it.i) {
      const img = document.createElement('img');
      img.className = 'ico';
      img.src = it.i;
      img.onerror = () => { img.style.visibility = 'hidden'; };
      el.appendChild(img);
    }
    const lab = document.createElement('span');
    lab.className = 'lab';
    lab.textContent = it.l;
    el.appendChild(lab);
    if (it.k) {
      const k = document.createElement('span');
      k.className = 'key';
      k.textContent = it.k;
      el.appendChild(k);
    }
    if (it.sub && it.sub.length) {
      const a = document.createElement('span');
      a.className = 'arr';
      a.textContent = '›';
      el.appendChild(a);
    }
    el.addEventListener('mouseenter', () => select(it.e ? rows().indexOf(el) : -1));   // greyed-out items don't light up
    el.addEventListener('click', () => { if (!dragMoved) activate(el); });
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (it.ctx && it.ctx.length) { stack.push({ title: it.l, items: it.ctx }); render(); }
    });
    el.addEventListener('pointerdown', (e) => startDrag(e, el));
    m.appendChild(el);
  });
  report();
}

// Reported right away (offsetWidth forces layout). Not via requestAnimationFrame:
// the popup window is hidden until this arrives, and hidden pages get no frames.
function report() {
  // Exact size of the bordered box: the window is cut to it (no extra strip).
  // Measured at natural size (the window may still have the previous menu's
  // size, and a squeezed menu would add a scrollbar's width).
  m.style.maxHeight = 'none';
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.maxHeight = '';
  post({ cmd: 'size', w, h });
}

function select(i) {
  const r = rows();
  r.forEach((el, k) => el.classList.toggle('sel', k === i));
  sel = i;
  if (r[i]) r[i].scrollIntoView({ block: 'nearest' });
}

function activate(el) {
  const it = el._item;
  if (!it || !it.e) return;
  if (it.sub && it.sub.length) { stack.push({ title: it.l, items: it.sub }); render(); select(0); return; }
  open = false;
  post({ cmd: 'pick', id: it.id });
}

function back() {
  if (stack.length > 1) { stack.pop(); render(); select(0); }
}

function move(d) {
  const r = rows();
  if (!r.length) return;
  let i = sel;
  for (let n = 0; n < r.length; n++) {
    i = (i + d + r.length) % r.length;
    if (!r[i].classList.contains('off')) break;
  }
  select(i);
}

document.addEventListener('keydown', (e) => {
  if (!open) return;
  const r = rows();
  const dialog = m.className === 'dialog';
  if (e.key === 'ArrowDown' || (dialog && e.key === 'ArrowRight') || (dialog && e.key === 'Tab' && !e.shiftKey)) move(1);
  else if (e.key === 'ArrowUp' || (dialog && e.key === 'ArrowLeft') || (dialog && e.key === 'Tab' && e.shiftKey)) move(-1);
  else if (e.key === 'Enter' || e.key === ' ') { if (r[sel]) activate(r[sel]); }
  else if (e.key === 'ArrowRight') { const it = r[sel] && r[sel]._item; if (it && it.sub && it.sub.length) activate(r[sel]); }
  else if (e.key === 'ArrowLeft' || e.key === 'Backspace') back();
  else if (e.key === 'Escape') { if (stack.length > 1) back(); else { open = false; post({ cmd: 'close' }); } }
  else return;
  e.preventDefault();
});

// ---- drag to reorder (items marked draggable, e.g. links in a folder) ----
let drag = null;
let dragMoved = false;
function startDrag(e, el) {
  dragMoved = false;
  if (e.button !== 0 || !el._item.d || stack.length > 1) return;
  drag = { el, y: e.clientY, on: false, to: -1 };
  el.setPointerCapture(e.pointerId);
}
function draggables() { return rows().filter((r) => r._item.d); }
m.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.on && Math.abs(e.clientY - drag.y) < 5) return;
  drag.on = true;
  dragMoved = true;
  drag.el.classList.add('dragging');
  // Outside this menu: dropping there hands the item to the browser (e.g. onto the saved tabs bar).
  drag.out = e.clientX < 0 || e.clientY < 0 || e.clientX > window.innerWidth || e.clientY > window.innerHeight;
  document.body.classList.toggle('out', drag.out);
  if (drag.out) { m.querySelectorAll('.ins').forEach((x) => x.remove()); return; }
  const list = draggables();
  let to = list.length;
  for (let k = 0; k < list.length; k++) {
    const r = list[k].getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { to = k; break; }
  }
  drag.to = to;
  m.querySelectorAll('.ins').forEach((x) => x.remove());
  const ins = document.createElement('div');
  ins.className = 'ins';
  if (to < list.length) m.insertBefore(ins, list[to]);
  else list[list.length - 1].after(ins);
});
function endDrag() {
  if (!drag) return;
  const d = drag;
  drag = null;
  m.querySelectorAll('.ins').forEach((x) => x.remove());
  d.el.classList.remove('dragging');
  document.body.classList.remove('out');
  if (!d.on) return;
  const list = draggables();
  const from = list.indexOf(d.el);
  if (d.out) {
    if (from >= 0) post({ cmd: 'drag_out', from });
    setTimeout(() => { dragMoved = false; }, 0);
    return;
  }
  let to = d.to > from ? d.to - 1 : d.to;
  if (from >= 0 && to >= 0 && to !== from) post({ cmd: 'reorder', from, to });
  setTimeout(() => { dragMoved = false; }, 0);
}
m.addEventListener('pointerup', endDrag);
m.addEventListener('pointercancel', endDrag);

document.addEventListener('contextmenu', (e) => e.preventDefault());

window.chrome.webview.addEventListener('message', (e) => {
  const msg = e.data;
  if (msg.type === 'show') {
    document.body.classList.toggle('light', !msg.dark);
    document.body.style.setProperty('--accent', msg.accent || '#b07cff');
    document.body.style.setProperty('--on-accent', msg.on_accent === 'black' ? '#1c1c1c' : msg.on_accent === 'white' ? '#ffffff' : onColor(msg.accent));
    // Custom colours (Settings -> Pro settings -> Colors)
    const c = msg.colors || {};
    for (const [n, v] of [['panel', c.panel], ['hover', c['btn-hover']], ['fg', c.fg], ['muted', c.muted], ['border', c.border]]) {
      if (v) document.body.style.setProperty('--' + n, v); else document.body.style.removeProperty('--' + n);
    }
    // Squircle corners (Settings -> Corner style) are 1.6x bigger, like the bar and the window cut.
    document.body.classList.toggle('squircle', !!msg.squircle);
    // Light theme / custom colours live on <body>; the page behind the box too.
    document.documentElement.style.background = getComputedStyle(document.body).getPropertyValue('--panel').trim();
    const rad = Math.round((typeof msg.radius === 'number' ? msg.radius : 10) * (msg.squircle ? 1.6 : 1));
    document.documentElement.style.setProperty('--radius', rad + 'px');
    document.documentElement.style.setProperty('--r-menu', (rad > 0 ? rad + 2 : 0) + 'px');
    stack = [{ title: '', items: msg.items }];
    open = true;
    render();
  } else if (msg.type === 'items') {
    stack = [{ title: '', items: msg.items }];
    render();
  } else if (msg.type === 'focus') {
    window.focus();
    m.focus();
  } else if (msg.type === 'hide') {
    open = false;
    stack = [];
    m.textContent = '';
  }
});

post({ cmd: 'ready' });
</script>
</body>
</html>
