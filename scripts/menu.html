<!doctype html>
<!-- Suppa Browser - popup menus (≡, tabs, saved tabs, page right-click).
     Edit, then press "Update" in the browser. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --panel: #1f1f1f; --hover: #333333; --fg: #ececec; --muted: #8e8e8e; --border: #383838;
    --accent: #b07cff; --on-accent: #1c1c1c;
    /* Corner roundness (Settings -> Corner roundness). The menu box is 2px rounder. */
    --radius: 10px; --r-menu: calc(var(--radius) + 2px); --r-item: max(0px, calc(var(--radius) - 2px)); --r-btn: max(0px, calc(var(--radius) - 1px));
  }
  body.light { --panel: #ffffff; --hover: #ececec; --fg: #1c1c1c; --muted: #6b6b6b; --border: #d0d0d0; }
  * { box-sizing: border-box; }
  body.squircle *, body.squircle *::before, body.squircle *::after { corner-shape: squircle; }
  /* long menus: scrollbar in the interface colours */
  ::-webkit-scrollbar { width: 10px; background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hover); border: 3px solid transparent; background-clip: padding-box; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
  /* The window is cut to the rounded shape (popup.rs). The few pixels between
     that cut and the box's outline take the panel colour (set from the theme by
     the script below), so nothing light ever shows in the corners. */
  /* one-colour site icons that would vanish in this theme (see toneIcon) */
  body.light img.ic-w, body:not(.light) img.ic-b { filter: invert(1); }
  html, body { margin: 0; background: var(--panel); overflow: hidden; user-select: none; }
  body { font: 400 10pt "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  #m {
    position: absolute; left: 0; top: 0; width: max-content; min-width: 230px; max-width: 460px;
    max-height: 100vh; overflow-y: auto; padding: 6px; background: var(--panel);
    border: 1px solid var(--border);
    /* 1px rounder than the window cut, so the whole outline stays inside it */
    border-radius: calc(var(--r-menu) + 1px);
    /* no browser focus ring (white + dark) around the box: keys are handled by the script */
    outline: none;
  }
  .head {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; margin-bottom: 4px;
    border-radius: var(--r-item); font-weight: 600; color: var(--muted);
  }
  .head:hover, .head.sel { background: var(--hover); color: var(--fg); }
  .it {
    display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 12px;
    border-radius: var(--r-item); white-space: nowrap; cursor: default;
  }
  .it.sel { background: var(--hover); }
  .it.off { color: var(--muted); }
  .it.hot .lab { color: var(--accent); font-weight: 600; }
  .chk { width: 16px; flex: 0 0 16px; text-align: center; color: var(--accent); font-weight: 700; margin-left: -4px; }
  /* no item in this menu can be ticked: no checkmark column, text starts at the same
     distance from the edge as the shortcuts end on the other side */
  #m.nochk .chk { display: none; }
  .ico { width: 16px; height: 16px; flex: 0 0 16px; object-fit: contain; }
  .lab { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
  .key { color: var(--muted); font-size: 9pt; margin-left: 24px; }
  .arr { color: var(--muted); margin-left: 12px; }
  .sep { height: 1px; background: var(--border); margin: 5px 6px; }
  .it.dragging { opacity: .35; }
  .ins { height: 2px; background: var(--accent); border-radius: 1px; margin: -1px 6px; }
  body.out, body.out * { cursor: copy !important; }
  /* ---- dialogs (Update, confirmations, messages) ---- */
  #m.dialog { min-width: 360px; max-width: 460px; padding: 18px 18px 14px; width: max-content; }
  .ttl { font-size: 11.5pt; font-weight: 600; margin: 0 2px 8px; max-width: 420px; white-space: normal; }
  .txt { color: var(--muted); margin: 0 2px 4px; max-width: 420px; white-space: pre-line; line-height: 1.45; }
  .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .btn {
    height: 32px; padding: 0 18px; border-radius: var(--r-btn); border: 1px solid var(--border);
    background: var(--hover); color: var(--fg); font: inherit; cursor: default; outline: none;
  }
  .btn:hover { filter: brightness(1.15); }
  /* the main button is exactly the accent colour (like the bar), also when focused */
  .btn.hot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.hot:hover { filter: brightness(1.06); }
  /* keyboard focus: a thin accent ring around the button, its colour unchanged */
  .btn.sel { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--accent); }
  .btn.hot.sel { box-shadow: none; }
  /* ---- player popup: one card per tab that plays ---- */
  .card { display: flex; gap: 12px; padding: 10px; width: 360px; border-radius: var(--r-item); }
  .card + .card { border-top: 1px solid var(--border); border-radius: 0; }
  .card .art {
    flex: 0 0 72px; width: 72px; height: 72px; border-radius: var(--r-item); overflow: hidden; cursor: pointer;
    background: var(--hover); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 26px;
  }
  .card.video .art { flex-basis: 128px; width: 128px; }
  .card .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .card .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .card .t1:hover { color: var(--accent); }
  .card .t2 { color: var(--muted); font-size: 9pt; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .prog { display: flex; align-items: center; gap: 6px; font-size: 8pt; color: var(--muted); }
  .card .bar { flex: 1; height: 3px; border-radius: 2px; background: var(--hover); overflow: hidden; }
  .card .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
  .card .ctl { display: flex; align-items: center; gap: 2px; margin-top: 2px; }
  .card .cb {
    width: 28px; height: 26px; border: none; border-radius: var(--r-item); background: transparent; color: var(--fg);
    display: flex; align-items: center; justify-content: center; cursor: default; padding: 0; outline: none;
  }
  .card .cb:hover { background: var(--hover); }
  .card .cb:disabled { opacity: .35; }
  .card .cb.main { background: var(--accent); color: var(--on-accent); }
  .card .cb svg { width: 14px; height: 14px; fill: currentColor; }
  .card .cb.stroke svg { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .card input[type=range] { flex: 1; min-width: 50px; accent-color: var(--accent); height: 16px; margin: 0 2px; }
  .card .vol { font-size: 8pt; color: var(--muted); width: 30px; text-align: right; }
  .card .links { display: flex; gap: 10px; font-size: 8.5pt; }
  .card .links span { color: var(--muted); cursor: pointer; }
  .card .links span:hover { color: var(--accent); }
</style>
</head>
<body>
<div id="m"></div>
<script>
'use strict';
// Site icons in Suppa's theme (light / dark), not the system's:
//  * An SVG icon that changes colour by itself (Rust's: white on dark systems)
//    follows the system setting, so it is shown as a copy set to Suppa's theme.
//  * An icon of one plain colour on a see-through background (GitHub's white
//    cat, a black logo) gets class "ic-w" (white) or "ic-b" (black); the page
//    inverts "ic-w" in the light theme and "ic-b" in the dark one.
//  * Coloured icons and icons with their own background are left alone.
// Only icons whose site allows reading them can be checked (most icon servers do).
const ICON_TONE = new Map();
function iconTone(url) {
  return new Promise((done) => {
    const probe = new Image();
    probe.onerror = () => done('');
    probe.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 24;
        const g = c.getContext('2d');
        g.drawImage(probe, 0, 0, 24, 24);
        const d = g.getImageData(0, 0, 24, 24).data;
        let clear = 0, solid = 0, white = 0, black = 0, colour = 0;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 60) { clear++; continue; }
          solid++;
          const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          if (Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]) > 40) colour++;
          else if (l > 200) white++;
          else if (l < 60) black++;
        }
        const see = clear / (clear + solid) > 0.2 && colour < solid * 0.08;
        done(!see || !solid ? '' : white > solid * 0.85 ? 'w' : black > solid * 0.85 ? 'b' : '');
      } catch (e) { done(''); }
    };
    probe.src = url;
  });
}
// -> { tone: '' | 'w' | 'b', src: address to show (a themed copy for adaptive SVGs) }
async function checkIcon(src, light) {
  try {
    const r = await fetch(src, { mode: 'cors', credentials: 'omit' });
    if (!r.ok) return { tone: '', src };
    const blob = await r.blob();
    if (/svg/.test(blob.type) || /\.svg(\?|$)/i.test(src)) {
      const text = await blob.text();
      if (/prefers-color-scheme/i.test(text)) {
        // Set the icon's own light/dark choice to Suppa's theme.
        const yes = 'min-width: 0px', no = 'max-width: 0px) and (min-width: 1px';
        const fixed = text
          .replace(/prefers-color-scheme\s*:\s*dark/gi, light ? no : yes)
          .replace(/prefers-color-scheme\s*:\s*light/gi, light ? yes : no);
        return { tone: '', src: URL.createObjectURL(new Blob([fixed], { type: 'image/svg+xml' })) };
      }
    }
    return { tone: await iconTone(URL.createObjectURL(blob)), src };
  } catch (e) {
    return { tone: '', src };   // the site does not allow reading its icon
  }
}
function toneIcon(img, src) {
  if (!/^https?:/.test(src)) return;
  img._tone = src;
  const light = document.body.classList.contains('light');
  const key = src + (light ? ' light' : ' dark');
  img._key = key;
  // only the answer for the current theme counts (an older check may finish later)
  const set = (v) => {
    if (img._key !== key || !v) return;
    img.classList.toggle('ic-w', v.tone === 'w');
    img.classList.toggle('ic-b', v.tone === 'b');
    if (img.getAttribute('src') !== v.src) img.src = v.src;
  };
  let t = ICON_TONE.get(key);
  if (t === undefined) {
    t = checkIcon(src, light);
    ICON_TONE.set(key, t);
    t.then((v) => ICON_TONE.set(key, v));
  }
  if (t instanceof Promise) t.then(set); else set(t);
}
// The theme changed: check the shown icons again (after the new colours apply).
function retoneIcons() {
  setTimeout(() => document.querySelectorAll('img').forEach((i) => { if (i._tone) toneIcon(i, i._tone); }), 60);
}
const m = document.getElementById('m');
const post = (x) => window.chrome.webview.postMessage(x);
let stack = [];      // panels: {title, items}
let sel = -1;
let open = false;

function onColor(hex) {
  const n = parseInt((hex || '#b07cff').slice(1), 16);
  return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 160 ? '#1c1c1c' : '#ffffff';
}

function cur() { return stack[stack.length - 1]; }
function rows() { return [...m.querySelectorAll('.it, .btn')]; }

// A popup with a heading is a dialog: title, text, buttons in a row.
function renderDialog(items) {
  m.className = 'dialog';
  const btns = document.createElement('div');
  btns.className = 'btns';
  for (const it of items) {
    if (it.H || it.P) {
      const d = document.createElement('div');
      d.className = it.H ? 'ttl' : 'txt';
      d.textContent = it.l;
      m.appendChild(d);
    } else if (!it.s) {
      const b = document.createElement('button');
      b.className = 'btn' + (it.h ? ' hot' : '');
      b.textContent = it.l;
      b._item = it;
      b.addEventListener('click', () => activate(b));
      b.addEventListener('mouseenter', () => select(rows().indexOf(b)));
      btns.appendChild(b);
    }
  }
  m.appendChild(btns);
  // Enter = the main (accent) button.
  const r = rows();
  select(Math.max(0, r.findIndex((b) => b.classList.contains('hot'))));
  report();
}

// ---- player cards ----
const ICONS = {
  play: '<svg viewBox="0 0 16 16"><path d="M4.5 2.8v10.4L13 8z"/></svg>',
  pause: '<svg viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>',
  next: '<svg viewBox="0 0 16 16"><path d="M3 3l7 5-7 5zM11 3h2v10h-2z"/></svg>',
  prev: '<svg viewBox="0 0 16 16"><path d="M13 3L6 8l7 5zM3 3h2v10H3z"/></svg>',
  snd: '<svg viewBox="0 0 16 16"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5"/></svg>',
  mute: '<svg viewBox="0 0 16 16"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z"/><path d="M11 6l4 4M15 6l-4 4"/></svg>',
};
let sliding = false;   // a volume slider is being dragged: no re-render under the mouse
let progTimer = 0;
const act = (tab, action, value) => post({ cmd: 'act', data: { tab, action, value } });
const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
function card(x) {
  const c = document.createElement('div');
  c.className = 'card' + (x.video ? ' video' : '');
  const art = document.createElement('div');
  art.className = 'art';
  art.title = 'Go to the tab';
  const src = x.frame || x.art;
  if (src) {
    const img = document.createElement('img');
    img.src = src;
    img.onerror = () => { img.remove(); art.textContent = '♪'; };
    art.appendChild(img);
  } else art.textContent = x.video ? '▶' : '♪';
  art.onclick = () => { open = false; post({ cmd: 'pick', id: x.tab }); };
  const info = document.createElement('div');
  info.className = 'info';
  const t1 = document.createElement('div');
  t1.className = 't1';
  t1.textContent = x.title || 'Playing';
  t1.title = (x.title || '') + ' - go to the tab';
  t1.onclick = art.onclick;
  const t2 = document.createElement('div');
  t2.className = 't2';
  t2.textContent = [x.artist, x.album, x.site].filter(Boolean).join(' · ');
  info.append(t1, t2);
  if (x.dur > 0) {
    const pr = document.createElement('div');
    pr.className = 'prog';
    const now = document.createElement('span');
    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('i');
    bar.appendChild(fill);
    const tot = document.createElement('span');
    tot.textContent = fmt(x.dur);
    pr.append(now, bar, tot);
    info.appendChild(pr);
    const upd = () => {
      const pos = Math.min(x.dur, x.pos + (x.playing && x.at ? (Date.now() - x.at) / 1000 : 0));
      now.textContent = fmt(pos);
      fill.style.width = (100 * pos / x.dur) + '%';
    };
    upd();
    c._upd = upd;
  }
  const ctl = document.createElement('div');
  ctl.className = 'ctl';
  const btn = (icon, title, action, cls) => {
    const b = document.createElement('button');
    b.className = 'cb' + (cls ? ' ' + cls : '');
    b.innerHTML = ICONS[icon];
    b.title = title;
    b.onclick = () => act(x.tab, action);
    ctl.appendChild(b);
    return b;
  };
  btn('prev', 'Previous', 'prev');
  btn(x.playing ? 'pause' : 'play', x.playing ? 'Pause' : 'Play', 'toggle', 'main');
  btn('next', 'Next', 'next').disabled = !x.next;
  btn(x.muted ? 'mute' : 'snd', x.muted ? 'Unmute this tab' : 'Mute this tab', 'mute', 'stroke');
  const r = document.createElement('input');
  r.type = 'range';
  r.min = 0; r.max = 100; r.step = 1;
  r.value = x.vol;
  r.title = 'Volume of this tab only (Windows volume stays as it is)';
  const vl = document.createElement('span');
  vl.className = 'vol';
  vl.textContent = x.vol + '%';
  let t = 0;
  r.addEventListener('pointerdown', () => { sliding = true; });
  r.addEventListener('input', () => {
    vl.textContent = r.value + '%';
    clearTimeout(t);
    t = setTimeout(() => act(x.tab, 'volume', +r.value), 40);
  });
  const done = () => { sliding = false; act(x.tab, 'volume', +r.value); };
  r.addEventListener('pointerup', done);
  r.addEventListener('change', done);
  ctl.append(r, vl);
  info.appendChild(ctl);
  const links = document.createElement('div');
  links.className = 'links';
  for (const [label, action] of [['Save video', 'save_video'], ['Save as MP3', 'save_mp3']]) {
    const l = document.createElement('span');
    l.textContent = label;
    l.onclick = () => act(x.tab, action);
    links.appendChild(l);
  }
  info.appendChild(links);
  c.append(art, info);
  return c;
}

function render() {
  const p = cur();
  if (p.items.some((it) => it.x && it.x.kind === 'player')) {
    m.textContent = '';
    m.className = '';
    sel = -1;
    for (const it of p.items) if (it.x && it.x.kind === 'player') m.appendChild(card(it.x));
    clearInterval(progTimer);
    progTimer = setInterval(() => m.querySelectorAll('.card').forEach((c) => c._upd && c._upd()), 1000);
    report();
    return;
  }
  clearInterval(progTimer);
  m.textContent = '';
  m.className = '';
  sel = -1;
  if (!p.items.some((it) => it.c)) m.classList.add('nochk');
  if (stack.length === 1 && p.items.some((it) => it.H)) { renderDialog(p.items); return; }
  if (stack.length > 1) {
    const h = document.createElement('div');
    h.className = 'head';
    h.textContent = '‹  ' + p.title;
    h.onclick = back;
    m.appendChild(h);
  }
  p.items.forEach((it, i) => {
    if (it.s) {
      const s = document.createElement('div');
      s.className = 'sep';
      m.appendChild(s);
      return;
    }
    const el = document.createElement('div');
    el.className = 'it' + (it.e ? '' : ' off') + (it.h ? ' hot' : '');
    el._item = it;
    el._index = i;
    const chk = document.createElement('span');
    chk.className = 'chk';
    chk.textContent = it.c ? '✓' : '';
    el.appendChild(chk);
    if (it.i) {
      const img = document.createElement('img');
      img.className = 'ico';
      img.src = it.i;
      img.onerror = () => { img.style.visibility = 'hidden'; };
      toneIcon(img, it.i);
      el.appendChild(img);
    }
    const lab = document.createElement('span');
    lab.className = 'lab';
    lab.textContent = it.l;
    el.appendChild(lab);
    if (it.k) {
      const k = document.createElement('span');
      k.className = 'key';
      k.textContent = it.k;
      el.appendChild(k);
    }
    if (it.sub && it.sub.length) {
      const a = document.createElement('span');
      a.className = 'arr';
      a.textContent = '›';
      el.appendChild(a);
    }
    el.addEventListener('mouseenter', () => select(it.e ? rows().indexOf(el) : -1));   // greyed-out items don't light up
    el.addEventListener('click', () => { if (!dragMoved) activate(el); });
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (it.ctx && it.ctx.length) { stack.push({ title: it.l, items: it.ctx }); render(); }
    });
    el.addEventListener('pointerdown', (e) => startDrag(e, el));
    m.appendChild(el);
  });
  report();
}

// Reported right away (offsetWidth forces layout). Not via requestAnimationFrame:
// the popup window is hidden until this arrives, and hidden pages get no frames.
function report() {
  // Exact size of the bordered box: the window is cut to it (no extra strip).
  // Measured at natural size (the window may still have the previous menu's
  // size, and a squeezed menu would add a scrollbar's width).
  m.style.maxHeight = 'none';
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.maxHeight = '';
  post({ cmd: 'size', w, h });
}

function select(i) {
  const r = rows();
  r.forEach((el, k) => el.classList.toggle('sel', k === i));
  sel = i;
  if (r[i]) r[i].scrollIntoView({ block: 'nearest' });
}

function activate(el) {
  const it = el._item;
  if (!it || !it.e) return;
  if (it.sub && it.sub.length) { stack.push({ title: it.l, items: it.sub }); render(); select(0); return; }
  open = false;
  post({ cmd: 'pick', id: it.id });
}

function back() {
  if (stack.length > 1) { stack.pop(); render(); select(0); }
}

function move(d) {
  const r = rows();
  if (!r.length) return;
  let i = sel;
  for (let n = 0; n < r.length; n++) {
    i = (i + d + r.length) % r.length;
    if (!r[i].classList.contains('off')) break;
  }
  select(i);
}

document.addEventListener('keydown', (e) => {
  if (!open) return;
  const r = rows();
  const dialog = m.className === 'dialog';
  if (e.key === 'ArrowDown' || (dialog && e.key === 'ArrowRight') || (dialog && e.key === 'Tab' && !e.shiftKey)) move(1);
  else if (e.key === 'ArrowUp' || (dialog && e.key === 'ArrowLeft') || (dialog && e.key === 'Tab' && e.shiftKey)) move(-1);
  else if (e.key === 'Enter' || e.key === ' ') { if (r[sel]) activate(r[sel]); }
  else if (e.key === 'ArrowRight') { const it = r[sel] && r[sel]._item; if (it && it.sub && it.sub.length) activate(r[sel]); }
  else if (e.key === 'ArrowLeft' || e.key === 'Backspace') back();
  else if (e.key === 'Escape') { if (stack.length > 1) back(); else { open = false; post({ cmd: 'close' }); } }
  else return;
  e.preventDefault();
});

// ---- drag to reorder (items marked draggable, e.g. links in a folder) ----
let drag = null;
let dragMoved = false;
function startDrag(e, el) {
  dragMoved = false;
  if (e.button !== 0 || !el._item.d || stack.length > 1) return;
  drag = { el, y: e.clientY, on: false, to: -1 };
  el.setPointerCapture(e.pointerId);
}
function draggables() { return rows().filter((r) => r._item.d); }
m.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.on && Math.abs(e.clientY - drag.y) < 5) return;
  drag.on = true;
  dragMoved = true;
  drag.el.classList.add('dragging');
  // Outside this menu: dropping there hands the item to the browser (e.g. onto the saved tabs bar).
  drag.out = e.clientX < 0 || e.clientY < 0 || e.clientX > window.innerWidth || e.clientY > window.innerHeight;
  document.body.classList.toggle('out', drag.out);
  if (drag.out) { m.querySelectorAll('.ins').forEach((x) => x.remove()); return; }
  const list = draggables();
  let to = list.length;
  for (let k = 0; k < list.length; k++) {
    const r = list[k].getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { to = k; break; }
  }
  drag.to = to;
  m.querySelectorAll('.ins').forEach((x) => x.remove());
  const ins = document.createElement('div');
  ins.className = 'ins';
  if (to < list.length) m.insertBefore(ins, list[to]);
  else list[list.length - 1].after(ins);
});
function endDrag() {
  if (!drag) return;
  const d = drag;
  drag = null;
  m.querySelectorAll('.ins').forEach((x) => x.remove());
  d.el.classList.remove('dragging');
  document.body.classList.remove('out');
  if (!d.on) return;
  const list = draggables();
  const from = list.indexOf(d.el);
  if (d.out) {
    if (from >= 0) post({ cmd: 'drag_out', from });
    setTimeout(() => { dragMoved = false; }, 0);
    return;
  }
  let to = d.to > from ? d.to - 1 : d.to;
  if (from >= 0 && to >= 0 && to !== from) post({ cmd: 'reorder', from, to });
  setTimeout(() => { dragMoved = false; }, 0);
}
m.addEventListener('pointerup', endDrag);
m.addEventListener('pointercancel', endDrag);

document.addEventListener('contextmenu', (e) => e.preventDefault());

window.chrome.webview.addEventListener('message', (e) => {
  const msg = e.data;
  if (msg.type === 'show') {
    document.body.classList.toggle('light', !msg.dark);
    document.body.style.setProperty('--accent', msg.accent || '#b07cff');
    document.body.style.setProperty('--on-accent', msg.on_accent === 'black' ? '#1c1c1c' : msg.on_accent === 'white' ? '#ffffff' : onColor(msg.accent));
    // Custom colours (Settings -> Pro settings -> Colors)
    const c = msg.colors || {};
    for (const [n, v] of [['panel', c.panel], ['hover', c['btn-hover']], ['fg', c.fg], ['muted', c.muted], ['border', c.border]]) {
      if (v) document.body.style.setProperty('--' + n, v); else document.body.style.removeProperty('--' + n);
    }
    // Squircle corners (Settings -> Corner style) are 1.6x bigger, like the bar and the window cut.
    document.body.classList.toggle('squircle', !!msg.squircle);
    // Light theme / custom colours live on <body>; the page behind the box too.
    document.documentElement.style.background = getComputedStyle(document.body).getPropertyValue('--panel').trim();
    const rad = Math.round((typeof msg.radius === 'number' ? msg.radius : 10) * (msg.squircle ? 1.6 : 1));
    document.documentElement.style.setProperty('--radius', rad + 'px');
    document.documentElement.style.setProperty('--r-menu', (rad > 0 ? rad + 2 : 0) + 'px');
    stack = [{ title: '', items: msg.items }];
    open = true;
    render();
  } else if (msg.type === 'items') {
    if (sliding) return;   // the next change shows it
    stack = [{ title: '', items: msg.items }];
    render();
  } else if (msg.type === 'focus') {
    window.focus();
    m.focus();
  } else if (msg.type === 'hide') {
    open = false;
    sliding = false;
    clearInterval(progTimer);
    stack = [];
    m.textContent = '';
  }
});

post({ cmd: 'ready' });
</script>
</body>
</html>
