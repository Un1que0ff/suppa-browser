<!doctype html>
<!-- Suppa Browser - History page (https://suppa.history/). Edit, then press "Update" in the browser. -->
<html>
<head>
<meta charset="utf-8">
<title>History</title>
<style>
  :root {
    --bg: #161616; --panel: #1f1f1f; --field: #272727; --btn: #2e2e2e; --btn-hover: #3b3b3b;
    --fg: #ececec; --muted: #8e8e8e; --border: #383838; --accent: #b07cff; --on-accent: #1c1c1c;
    --radius: 10px; --r-btn: max(0px, calc(var(--radius) - 1px)); --r-box: calc(var(--radius) + 4px);
  }
  body.light { --bg: #f2f2f2; --panel: #ffffff; --field: #ffffff; --btn: #e5e5e5; --btn-hover: #d8d8d8; --fg: #1c1c1c; --muted: #6b6b6b; --border: #d0d0d0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 10.5pt "Segoe UI", system-ui, sans-serif; }
  body.squircle *, body.squircle *::before { corner-shape: squircle; }
  main { max-width: 900px; margin: 0 auto; padding: 26px 28px 60px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 16px; }
  .top { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .top input { flex: 1 1 260px; }
  button {
    height: 30px; padding: 0 14px; background: var(--btn); color: var(--fg); border: 1px solid var(--border);
    border-radius: var(--r-btn); font: inherit; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: var(--btn-hover); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button.danger:hover { background: #c0392b; color: #fff; border-color: #c0392b; }
  button[hidden] { display: none; }
  input[type=text] {
    height: 32px; background: var(--field); color: var(--fg); border: 1px solid var(--border);
    border-radius: var(--r-btn); padding: 0 12px; font: inherit; outline: none;
  }
  /* focused: one real 2px accent border, 1px less padding so the text stays put */
  input[type=text]:focus { border: 2px solid var(--accent); padding: 0 11px; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-box); padding: 4px 14px; margin-bottom: 14px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid var(--border); min-height: 40px; }
  h2 + .row { border-top: none; }
  .row input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; flex: 0 0 auto; }
  .time { color: var(--muted); width: 44px; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .what { flex: 1 1 auto; min-width: 0; display: flex; gap: 10px; align-items: baseline; }
  .what a { color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .what a:hover { text-decoration: underline; }
  .what small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  .x { height: 26px; width: 26px; padding: 0; background: transparent; border-color: transparent; color: var(--muted); opacity: 0; }
  .row:hover .x { opacity: 1; }
  .x:hover { color: var(--fg); }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  #more { display: block; margin: 10px auto; }
  #more[hidden] { display: none; }
  .ic { width: 16px; height: 16px; flex: 0 0 16px; object-fit: contain; align-self: center; }
  .ic.none { border-radius: 50%; background: var(--btn-hover); }
  /* one-colour site icons that would vanish in this theme (see toneIcon) */
  body.light img.ic-w, body:not(.light) img.ic-b { filter: invert(1); }
  ::-webkit-scrollbar { width: 12px; background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--btn-hover); border: 3px solid var(--bg); border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>History</h1>
  <div class="top">
    <input type="text" id="q" placeholder="Search history" spellcheck="false" autofocus>
    <button id="del-sel" class="danger" hidden>Delete selected</button>
    <button id="clear-hour">Delete last hour</button>
    <button id="clear-all" class="danger">Delete all history</button>
  </div>
  <div id="list"></div>
  <button id="more" hidden>Show more</button>
</main>
<script>
'use strict';
// Site icons in Suppa's theme (light / dark), not the system's:
//  * An SVG icon that changes colour by itself (Rust's: white on dark systems)
//    follows the system setting, so it is shown as a copy set to Suppa's theme.
//  * An icon of one plain colour on a see-through background (GitHub's white
//    cat, a black logo) gets class "ic-w" (white) or "ic-b" (black); the page
//    inverts "ic-w" in the light theme and "ic-b" in the dark one.
//  * Coloured icons and icons with their own background are left alone.
// Only icons whose site allows reading them can be checked (most icon servers do).
const ICON_TONE = new Map();
function iconTone(url) {
  return new Promise((done) => {
    const probe = new Image();
    probe.onerror = () => done('');
    probe.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 24;
        const g = c.getContext('2d');
        g.drawImage(probe, 0, 0, 24, 24);
        const d = g.getImageData(0, 0, 24, 24).data;
        let clear = 0, solid = 0, white = 0, black = 0, colour = 0;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 60) { clear++; continue; }
          solid++;
          const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          if (Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]) > 40) colour++;
          else if (l > 200) white++;
          else if (l < 60) black++;
        }
        const see = clear / (clear + solid) > 0.2 && colour < solid * 0.08;
        done(!see || !solid ? '' : white > solid * 0.85 ? 'w' : black > solid * 0.85 ? 'b' : '');
      } catch (e) { done(''); }
    };
    probe.src = url;
  });
}
// -> { tone: '' | 'w' | 'b', src: address to show (a themed copy for adaptive SVGs) }
async function checkIcon(src, light) {
  try {
    const r = await fetch(src, { mode: 'cors', credentials: 'omit' });
    if (!r.ok) return { tone: '', src };
    const blob = await r.blob();
    if (/svg/.test(blob.type) || /\.svg(\?|$)/i.test(src)) {
      const text = await blob.text();
      if (/prefers-color-scheme/i.test(text)) {
        // Set the icon's own light/dark choice to Suppa's theme.
        const yes = 'min-width: 0px', no = 'max-width: 0px) and (min-width: 1px';
        const fixed = text
          .replace(/prefers-color-scheme\s*:\s*dark/gi, light ? no : yes)
          .replace(/prefers-color-scheme\s*:\s*light/gi, light ? yes : no);
        return { tone: '', src: URL.createObjectURL(new Blob([fixed], { type: 'image/svg+xml' })) };
      }
    }
    return { tone: await iconTone(URL.createObjectURL(blob)), src };
  } catch (e) {
    return { tone: '', src };   // the site does not allow reading its icon
  }
}
function toneIcon(img, src) {
  if (!/^https?:/.test(src)) return;
  img._tone = src;
  const light = document.body.classList.contains('light');
  const key = src + (light ? ' light' : ' dark');
  img._key = key;
  // only the answer for the current theme counts (an older check may finish later)
  const set = (v) => {
    if (img._key !== key || !v) return;
    img.classList.toggle('ic-w', v.tone === 'w');
    img.classList.toggle('ic-b', v.tone === 'b');
    if (img.getAttribute('src') !== v.src) img.src = v.src;
  };
  let t = ICON_TONE.get(key);
  if (t === undefined) {
    t = checkIcon(src, light);
    ICON_TONE.set(key, t);
    t.then((v) => ICON_TONE.set(key, v));
  }
  if (t instanceof Promise) t.then(set); else set(t);
}
// The theme changed: check the shown icons again (after the new colours apply).
function retoneIcons() {
  setTimeout(() => document.querySelectorAll('img').forEach((i) => { if (i._tone) toneIcon(i, i._tone); }), 60);
}
const $ = (id) => document.getElementById(id);
const post = (m) => window.chrome.webview.postMessage(m);
let items = [];
let sel = new Set();
const key = (it) => it.t + ' ' + it.url;

// ---- theme (same values as Settings) ----
function onColor(hex) {
  const n = parseInt((hex || '#b07cff').slice(1), 16);
  return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 160 ? '#1c1c1c' : '#ffffff';
}
function theme(S) {
  const was = document.body.classList.contains('light');
  document.body.classList.toggle('light', !S.dark);
  // checkboxes and scrollbars drawn for the theme (not always light)
  document.documentElement.style.colorScheme = S.dark ? 'dark' : 'light';
  if (was !== !S.dark) retoneIcons();
  document.body.classList.toggle('squircle', S.corner_shape === 'squircle');
  const c = S.palette || S.colors || {};
  for (const n of ['bg', 'panel', 'field', 'btn', 'btn-hover', 'fg', 'muted', 'border']) {
    if (c[n]) document.body.style.setProperty('--' + n, c[n]); else document.body.style.removeProperty('--' + n);
  }
  const acc = S.accent === 'cycle' ? '#b07cff' : S.accent === 'windows' ? S.windows_accent : S.accent;
  document.body.style.setProperty('--accent', acc);
  document.body.style.setProperty('--on-accent', S.on_accent === 'black' ? '#1c1c1c' : S.on_accent === 'white' ? '#ffffff' : onColor(acc));
  document.documentElement.style.setProperty('--radius', Math.round((S.radius || 10) * (S.corner_shape === 'squircle' ? 1.6 : 1)) + 'px');
}

function dayName(t) {
  const d = new Date(t), today = new Date();
  const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((start(today) - start(d)) / 86400000);
  const long = d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  return diff === 0 ? 'Today - ' + long : diff === 1 ? 'Yesterday - ' + long : long;
}
function host(url) { try { return new URL(url).host.replace(/^www\./, ''); } catch (e) { return url; } }

function render() {
  const box = $('list');
  box.textContent = '';
  if (!items.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = $('q').value.trim() ? 'Nothing found.' : 'No history yet.';
    box.appendChild(e);
  }
  let sec = null, day = '';
  for (const it of items) {
    const dn = dayName(it.t);
    if (dn !== day) {
      day = dn;
      sec = document.createElement('section');
      const h = document.createElement('h2');
      h.textContent = dn;
      sec.appendChild(h);
      box.appendChild(sec);
    }
    const row = document.createElement('div');
    row.className = 'row';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = sel.has(key(it));
    cb.onchange = () => { cb.checked ? sel.add(key(it)) : sel.delete(key(it)); $('del-sel').hidden = !sel.size; };
    const tm = document.createElement('span');
    tm.className = 'time';
    tm.textContent = new Date(it.t).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    // the site's icon (the one its tab showed), or a plain dot
    const ic = document.createElement(it.icon ? 'img' : 'span');
    ic.className = it.icon ? 'ic' : 'ic none';
    if (it.icon) {
      ic.src = it.icon;
      ic.alt = '';
      toneIcon(ic, it.icon);
      ic.onerror = () => { const d = document.createElement('span'); d.className = 'ic none'; ic.replaceWith(d); };
    }
    const what = document.createElement('div');
    what.className = 'what';
    const a = document.createElement('a');
    a.href = it.url;
    a.textContent = it.title || it.url;
    a.title = it.url;
    const s = document.createElement('small');
    s.textContent = host(it.url);
    what.append(a, s);
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.title = 'Delete from history';
    x.onclick = () => post({ cmd: 'delete', items: [{ t: it.t, url: it.url }] });
    row.append(cb, tm, ic, what, x);
    sec.appendChild(row);
  }
  $('del-sel').hidden = !sel.size;
}

function load(append) {
  post({ cmd: 'list', q: $('q').value, offset: append ? items.length : 0 });
}

window.chrome.webview.addEventListener('message', (e) => {
  const m = e.data;
  if (!m) return;
  if (m.type === 'settings') theme(m);
  else if (m.type === 'hist') {
    items = m.offset ? items.concat(m.items) : m.items;
    $('more').hidden = !m.more;
    render();
  } else if (m.type === 'hist_changed') { sel.clear(); load(false); }
});

let qt = 0;
$('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => load(false), 150); });
$('more').onclick = () => load(true);
$('del-sel').onclick = () => {
  const list = items.filter((it) => sel.has(key(it))).map((it) => ({ t: it.t, url: it.url }));
  post({ cmd: 'delete', items: list });
};
$('clear-hour').onclick = () => post({ cmd: 'clear', since: Date.now() - 3600000 });
$('clear-all').onclick = () => post({ cmd: 'clear', since: 0 });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { post({ cmd: 'get' }); load(false); } });
post({ cmd: 'get' });
load(false);
</script>
</body>
</html>
