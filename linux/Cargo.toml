[package]
name = "suppa-linux"
version = "0.7.0"
edition = "2024"
description = "Suppa Browser for Linux (GTK + WebKitGTK)"

[[bin]]
name = "suppa"
path = "src/main.rs"

[dependencies]
# Brave's ad-block engine (same as the Windows version) + conversion of the
# network rules to WebKit content-blocker rules.
adblock = { version = "0.13.6", features = ["content-blocking"] }
serde_json = "1"
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = "1.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
